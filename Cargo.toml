[package]
name = "r4pm"
version = "0.6.1-alpha.1"
edition = "2021"
rust-version = "1.88"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "r4pm"
crate-type = ["cdylib"]

[dependencies]
process_mining = {features = ["dataframes", "bindings", "ocel-sqlite", "ocel-duckdb"], git = "https://github.com/aarkue/rust4pm", branch = "feat/ocel-duckdb-streaming"}
# process_mining = {features = ["dataframes", "bindings", "ocel-sqlite", "ocel-duckdb"], path = "../rust4pm/process_mining"}
# Only here to statically link DuckDB (feature-unified into process_mining's duckdb dep), so wheels need no system libduckdb
duckdb = {version = "1.2.1", features = ["bundled"]}
pyo3 = {version = "0.25", features = [ "extension-module"]}
polars = {version = "0.51.0", features = ["dtype-slim","timezones","partition_by"]}
pyo3-polars = {version = "0.24.0", features = ["dtype-struct"]}
rayon = "1.7.0"
chrono = {version = "0.4.34", features = ["serde"] }
uuid = {version = "1.4.1", features = ["v4", "serde"]}
serde_json = "1.0.105"
serde = {version = "1.0.188", features = ["derive"]}
inventory = "0.3"

[build-dependencies]
serde_json = "1.0"
# No ocel-duckdb here: build.rs only reads binding metadata, and this would compile DuckDB a second time for the host
process_mining = {features = ["dataframes", "bindings", "ocel-sqlite"], git = "https://github.com/aarkue/rust4pm", branch = "feat/ocel-duckdb-streaming"}
# process_mining = {features = ["dataframes", "bindings", "ocel-sqlite"], path = "../rust4pm/process_mining"}
