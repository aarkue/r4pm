[package]
name = "r4pm"
version = "0.7.1"
edition = "2021"
# `dataframes` in process_mining needs 1.95 (polars 0.55)
rust-version = "1.95"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "r4pm"
crate-type = ["cdylib"]

# Two distributions: `r4pm` (default) and `r4pm-full` (--features full). DuckDB is ~15 MiB/wheel.
[features]
default = []
ocel-duckdb = ["process_mining/ocel-duckdb-bundled", "process_mining/extraction-dbcon-duckdb-bundled"]
full = ["ocel-duckdb"]

[dependencies]
process_mining = {version = "0.7.1", features = ["dataframes", "bindings", "ocel-sqlite", "log-splitting", "token-based-replay", "extraction-blueprint", "extraction-dbcon", "ocel-bundle", "ocel-bundle-parquet"]}
pyo3 = {version = "0.29", features = [ "extension-module", "abi3-py39"]}
polars = {version = "0.55", features = ["dtype-slim","timezones","partition_by"]}
pyo3-polars = {version = "0.28", features = ["dtype-struct"]}
rayon = "1.7.0"
chrono = {version = "0.4.34", features = ["serde"] }
uuid = {version = "1.4.1", features = ["v4", "serde"]}
serde_json = "1.0.105"
serde = {version = "1.0.188", features = ["derive"]}
inventory = "0.3"

[build-dependencies]
serde_json = "1.0"
# Must mirror [dependencies]: build.rs generates the Python wrappers from the registry it sees
# here, so a feature missing here drops those bindings from the wheel.
process_mining = {version = "0.7.1", features = ["dataframes", "bindings", "ocel-sqlite", "log-splitting", "token-based-replay", "extraction-blueprint", "extraction-dbcon", "ocel-bundle", "ocel-bundle-parquet"]}
