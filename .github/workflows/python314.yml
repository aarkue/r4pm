name: Python3.14

on:
  push:
    tags:
      - 'experimental-ocpq-v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
    env:
      CARGO_BUILD_JOBS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      NUM_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.14
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14
          sccache: 'true'
          manylinux: 2_28
          before-script-linux: |
            dnf install -y openssl-devel pkgconf-pkg-config
      - name: Smoke test wheel
        run: |
          python -m venv /tmp/v
          . /tmp/v/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links dist r4pm
          python -c "import r4pm; from r4pm.bindings.core.event_data.object_centric.graph_db import ocel_kuzudb; from r4pm.bindings.core.event_data.object_centric.ocel_sql.duckdb import duckdb_ocel_export; print('smoke ok')"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
    env:
      CARGO_BUILD_JOBS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      NUM_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.14
          architecture: ${{ matrix.platform.target }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Ninja
        run: pip install ninja
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14
          sccache: 'true'
      - name: Smoke test wheel
        shell: bash
        run: |
          python -m venv /tmp/v
          . /tmp/v/Scripts/activate
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links dist r4pm
          python -c "import r4pm; from r4pm.bindings.core.event_data.object_centric.graph_db import ocel_kuzudb; from r4pm.bindings.core.event_data.object_centric.ocel_sql.duckdb import duckdb_ocel_export; print('smoke ok')"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/experimental-ocpq-v') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, windows, sdist]
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'wheels-*/*'
      - name: Publish GitHub pre-release
        if: ${{ startsWith(github.ref, 'refs/tags/experimental-ocpq-v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#experimental-ocpq-v}"
          gh release create "$GITHUB_REF_NAME" wheels-*/* \
            --repo "${{ github.repository }}" \
            --title "r4pm experimental OCPQ alpha $GITHUB_REF_NAME" \
            --notes "Experimental OCPQ alpha build for testing. Install with: python -m pip install r4pm==${VERSION}" \
            --prerelease \
            --latest=false
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/experimental-ocpq-v') }}
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
