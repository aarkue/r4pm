name: Python3.14

on:
  push:
    tags:
      - 'experimental-ocpq-v*'
    branches:
      - 'feat/r4pm-updates-and-ocpq-support'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DUCKDB_VERSION: v1.5.1
  KUZU_VERSION: v0.11.2
  MATURIN_VERSION: v1.13.3

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
            duckdb_asset: libduckdb-linux-amd64.zip
            kuzu_asset: libkuzu-linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.14
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14 --auditwheel=repair
          sccache: 'true'
          manylinux: 2_28
          before-script-linux: |
            set -euxo pipefail
            dnf install -y openssl-devel pkgconf-pkg-config unzip
            mkdir -p /io/native/duckdb /io/native/kuzu
            curl -fL -o /tmp/duckdb.zip "https://github.com/duckdb/duckdb/releases/download/${{ env.DUCKDB_VERSION }}/${{ matrix.platform.duckdb_asset }}"
            unzip -o /tmp/duckdb.zip -d /io/native/duckdb
            curl -fL -o /tmp/kuzu.tar.gz "https://github.com/kuzudb/kuzu/releases/download/${{ env.KUZU_VERSION }}/${{ matrix.platform.kuzu_asset }}"
            tar xzf /tmp/kuzu.tar.gz -C /io/native/kuzu
            export DUCKDB_LIB_DIR=/io/native/duckdb
            export DUCKDB_INCLUDE_DIR=/io/native/duckdb
            export KUZU_SHARED=1
            export KUZU_LIBRARY_DIR=/io/native/kuzu
            export KUZU_INCLUDE_DIR=/io/native/kuzu
            export LD_LIBRARY_PATH=/io/native/kuzu:/io/native/duckdb:${LD_LIBRARY_PATH:-}
            ls -la /io/native/duckdb /io/native/kuzu
      - name: Smoke test wheel
        run: |
          set -euxo pipefail
          ls -la dist
          unzip -l dist/*.whl | head -60
          python -m venv /tmp/v
          . /tmp/v/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links dist r4pm
          python -c "import r4pm; from r4pm.bindings.core.event_data.object_centric.graph_db import ocel_kuzudb; from r4pm.bindings.core.event_data.object_centric.ocel_sql.duckdb import duckdb_ocel_export; print('smoke ok')"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            duckdb_asset: libduckdb-windows-amd64.zip
            kuzu_asset: libkuzu-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.14
          architecture: ${{ matrix.platform.target }}
      - name: Download native libraries
        shell: bash
        run: |
          set -euxo pipefail
          NATIVE_DIR="$GITHUB_WORKSPACE/native"
          mkdir -p "$NATIVE_DIR/duckdb" "$NATIVE_DIR/kuzu"
          curl -fL -o /tmp/duckdb.zip "https://github.com/duckdb/duckdb/releases/download/${{ env.DUCKDB_VERSION }}/${{ matrix.platform.duckdb_asset }}"
          unzip -o /tmp/duckdb.zip -d "$NATIVE_DIR/duckdb"
          curl -fL -o /tmp/kuzu.zip "https://github.com/kuzudb/kuzu/releases/download/${{ env.KUZU_VERSION }}/${{ matrix.platform.kuzu_asset }}"
          unzip -o /tmp/kuzu.zip -d "$NATIVE_DIR/kuzu"
          DUCKDB_WIN=$(cygpath -w "$NATIVE_DIR/duckdb")
          KUZU_WIN=$(cygpath -w "$NATIVE_DIR/kuzu")
          {
            echo "DUCKDB_LIB_DIR=${DUCKDB_WIN}"
            echo "DUCKDB_INCLUDE_DIR=${DUCKDB_WIN}"
            echo "KUZU_SHARED=1"
            echo "KUZU_LIBRARY_DIR=${KUZU_WIN}"
            echo "KUZU_INCLUDE_DIR=${KUZU_WIN}"
          } >> "$GITHUB_ENV"
          # Put DLL dirs on PATH so maturin's wheel repair can locate them
          {
            echo "${DUCKDB_WIN}"
            echo "${KUZU_WIN}"
          } >> "$GITHUB_PATH"
          ls -la "$NATIVE_DIR/duckdb" "$NATIVE_DIR/kuzu"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14 --auditwheel=repair
          sccache: 'true'
      - name: Smoke test wheel
        shell: bash
        run: |
          set -euxo pipefail
          ls -la dist
          unzip -l dist/*.whl | head -60
          python -m venv /tmp/v
          . /tmp/v/Scripts/activate
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links dist r4pm
          python -c "import r4pm; from r4pm.bindings.core.event_data.object_centric.graph_db import ocel_kuzudb; from r4pm.bindings.core.event_data.object_centric.ocel_sql.duckdb import duckdb_ocel_export; print('smoke ok')"
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/experimental-ocpq-v') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, windows, sdist]
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'wheels-*/*'
      - name: Publish GitHub pre-release
        if: ${{ startsWith(github.ref, 'refs/tags/experimental-ocpq-v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#experimental-ocpq-v}"
          gh release create "$GITHUB_REF_NAME" wheels-*/* \
            --repo "${{ github.repository }}" \
            --title "r4pm experimental OCPQ alpha $GITHUB_REF_NAME" \
            --notes "Experimental OCPQ alpha build for testing. Install with: python -m pip install r4pm==${VERSION}" \
            --prerelease \
            --latest=false
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/experimental-ocpq-v') }}
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
